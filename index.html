<style>
/* Layout: one narrow app column (max 560px), screens swap in place; chunky tiles in the three subject colours from a school poster */
:root{
  --bg:#F3F1FB; --surface:#FFFFFF; --surface-2:#ECE9F8; --ink:#1D2550; --muted:#5E6590; --line:#DAD6EE;
  --en:#2F8FE8; --en-soft:#DDEEFE; --math:#1F9E5E; --math-soft:#D8F4E5; --ru:#DE4A7B; --ru-soft:#FCE1EA;
  --sun:#FFC23A; --sun-soft:#FFF0C7; --on-c:#FFFFFF;
  --good:#1C9454; --good-soft:#DCF5E6; --bad:#D2433A; --bad-soft:#FDE2DE;
  --font-display:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11152C; --surface:#1B2143; --surface-2:#252C55; --ink:#EEF0FF; --muted:#A4AAD4; --line:#323A6A;
  --en:#62B2F6; --en-soft:#1B3255; --math:#43CC88; --math-soft:#153A2B; --ru:#F27FA4; --ru-soft:#43203A;
  --sun:#FFCD58; --sun-soft:#3B3216; --on-c:#11152C;
  --good:#46D08B; --good-soft:#163B2B; --bad:#FF7C6E; --bad-soft:#47201F; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11152C; --surface:#1B2143; --surface-2:#252C55; --ink:#EEF0FF; --muted:#A4AAD4; --line:#323A6A;
  --en:#62B2F6; --en-soft:#1B3255; --math:#43CC88; --math-soft:#153A2B; --ru:#F27FA4; --ru-soft:#43203A;
  --sun:#FFCD58; --sun-soft:#3B3216; --on-c:#11152C;
  --good:#46D08B; --good-soft:#163B2B; --bad:#FF7C6E; --bad-soft:#47201F; color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.15}
.muted{color:var(--muted)}
.label{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* Home */
.hero{display:flex;align-items:center;gap:14px}
.hero svg{flex:none;width:68px;height:68px}
.hero h1{font-size:32px}
.hero p{margin:2px 0 0;color:var(--muted);font-size:15px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.pill b{font-family:var(--font-display);font-size:18px}
section{display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sechead h2{font-size:23px}
.subjects{display:flex;flex-direction:column;gap:10px}
.subj{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--cs);border-radius:var(--r);padding:14px 16px;border:2px solid transparent;transition:transform .12s}
.subj:active{transform:scale(.98)}
.glyph{flex:none;width:56px;height:56px;border-radius:18px;background:var(--c);color:var(--on-c);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:.02em;transform:rotate(-4deg)}
.sname{flex:1;min-width:0;font-weight:600;font-size:19px;display:flex;flex-direction:column}
.sname small{font-weight:400;font-size:14px;color:var(--muted)}
.state{flex:none;font-weight:700;color:var(--c);font-size:15px}
.subj.done{background:var(--surface);border-color:var(--cs)}
.subj.done .state{background:var(--cs);padding:4px 10px;border-radius:999px}
.banner{background:var(--sun-soft);border:2px dashed var(--sun);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center}
.banner .big{font-size:34px;line-height:1}
.banner h3{font-size:19px}
.banner p{margin:2px 0 0;font-size:15px;color:var(--muted)}
.tabs{display:flex;gap:6px;background:var(--surface-2);padding:5px;border-radius:16px}
.tab{flex:1;padding:8px 6px;border-radius:12px;font-weight:600;font-size:15px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--c);box-shadow:0 1px 3px rgba(20,25,60,.12)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:9px 13px;font-size:15px;font-weight:500;text-align:left}
.chip:hover{border-color:var(--c)}
.mist{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bad-soft);border-radius:var(--r);padding:14px 16px}
.mist .n{flex:none;width:44px;height:44px;border-radius:14px;background:var(--bad);color:var(--on-c);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:20px}
.mist span{flex:1;font-weight:600}
.mist small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;border:1.5px solid var(--line);display:flex;flex-direction:column;gap:14px}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.day i{width:100%;max-width:22px;aspect-ratio:1;border-radius:7px;background:var(--surface-2);display:block}
.day.part i{background:var(--sun-soft);box-shadow:inset 0 0 0 2px var(--sun)}
.day.full i{background:var(--sun)}
.day.today span{color:var(--ink);font-weight:700}
.lvl{display:flex;flex-direction:column;gap:6px}
.lvl .row{display:flex;justify-content:space-between;font-size:15px}
.meter{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--sun);border-radius:99px}
.acc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.acc div{background:var(--cs);border-radius:16px;padding:10px;text-align:center}
.acc b{display:block;font-family:var(--font-display);font-size:24px;color:var(--c);font-variant-numeric:tabular-nums}
.acc small{font-size:13px;color:var(--muted)}
.settings{display:flex;flex-direction:column;gap:10px;font-size:15px}
.settings .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.settings input[type=text]{font:inherit;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:160px}
.ghost{padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);font-size:15px;background:var(--surface)}
.ghost.warn{border-color:var(--bad);color:var(--bad)}
.note{font-size:13px;color:var(--muted);margin:0}

/* Quiz */
.qtop{display:flex;align-items:center;gap:12px}
.x{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);font-size:18px;flex:none}
.bar{flex:1;height:14px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .3s}
.cnt{font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.qcard{background:var(--surface);border-radius:var(--r);padding:20px 18px;border:2px solid var(--cs);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.qmeta{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--c)}
.ask{margin:0;color:var(--muted);font-size:16px}
.pic{font-size:84px;line-height:1.1}
.qtext{font-family:var(--font-display);font-size:26px;line-height:1.35;overflow-wrap:anywhere}
.qtext.long{font-size:21px}
.qtext.word{font-size:36px;letter-spacing:.02em}
.gap{display:inline-block;min-width:2.2em;border-bottom:3px solid var(--c);color:var(--c);padding:0 4px;margin:0 2px}
.gap.ok{color:var(--good);border-color:var(--good)}
.say{display:inline-flex;align-items:center;gap:6px;background:var(--cs);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;font-size:15px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 10px;font-size:19px;font-weight:600;min-height:62px;transition:transform .1s;overflow-wrap:anywhere}
.opt.big{font-family:var(--font-display);font-size:28px}
.opt:active{transform:scale(.97)}
.opt.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.5}
.numbox{background:var(--surface);border:2px solid var(--line);border-radius:18px;min-height:64px;display:grid;place-items:center;font-family:var(--font-display);font-size:34px;font-variant-numeric:tabular-nums}
.numbox.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.numbox.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.numbox .ph{color:var(--muted);font-size:22px;font-family:var(--font-body)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;height:58px;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.key:active{background:var(--surface-2)}
.key.go{background:var(--c);color:var(--on-c);border-color:var(--c);font-size:18px}
.fb{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.fb.ok{background:var(--good-soft)}
.fb.bad{background:var(--bad-soft)}
.fb h3{font-size:22px}
.fb.ok h3{color:var(--good)}
.fb.bad h3{color:var(--bad)}
.fb p{margin:0;font-size:16px}
.fb .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bline{min-height:64px;background:var(--surface);border:2px dashed var(--line);border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.bline .ph{color:var(--muted);font-size:15px}
.bline.ok{border:2px solid var(--good);background:var(--good-soft)}
.bline.bad{border:2px solid var(--bad);background:var(--bad-soft)}
.bpool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.bw{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-size:19px;font-weight:600}
.bline .bw{border-color:var(--c)}
.bw.used{visibility:hidden}
.next:disabled{opacity:.45;cursor:default}
.next{width:100%;background:var(--c);color:var(--on-c);border-radius:18px;padding:15px;font-size:19px;font-weight:700}

/* Result */
.result{text-align:center;align-items:center}
.result .score{font-family:var(--font-display);font-size:64px;line-height:1;color:var(--c)}
.result h1{font-size:30px}
.starsrow{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;font-size:30px}
.starsrow .off{opacity:.22;filter:grayscale(1)}
.btns{display:flex;flex-direction:column;gap:10px;width:100%}
.btn2{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;font-size:18px;font-weight:600}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out both}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
@media (prefers-reduced-motion:reduce){.pop,.shake{animation:none}.bar i{transition:none}}
@media (max-width:380px){.qtext{font-size:23px}.qtext.word{font-size:30px}.opt{font-size:17px}.pic{font-size:70px}}
</style>

const qkey=q=>(q.ask||'')+'|'+(q.text||'')+'|'+(q.pic||'')+'|'+q.answer;
const qh=q=>hashStr(qkey(q)).toString(36);
/* Daily plan: one core topic + the 5 topics that were practised longest ago, so every topic comes round regularly */
function dailyPlan(subj,r){
  const S_=SUBJ[subj];const core=pick(r,S_.core);
  const rest=shuffle(r,S_.topics.map(t=>t.id).filter(id=>id!==core)).sort((a,b)=>(S.use[subj+':'+a]||0)-(S.use[subj+':'+b]||0)).slice(0,5);
  rest.forEach(id=>S.use[subj+':'+id]=++S.tick);
  return [core,...shuffle(r,rest)];
}
/* For every slot try many candidates and take one Semyon has never seen (or saw longest ago) */
function build(subj,topicId,n,r){
  const S_=SUBJ[subj];const plan=topicId?Array(n).fill(topicId):dailyPlan(subj,r);
  const used=new Set(),qs=[];
  for(const tid of plan){
    const t=S_.topics.find(x=>x.id===tid);let best=null,bestAge=Infinity;
    for(let i=0;i<80;i++){const q=t.gen(r);const h=qh(q);if(used.has(h))continue;const age=S.seen[h]||0;if(age<bestAge){best=q;bestAge=age;}if(age===0)break;}
    if(!best)best=t.gen(r);used.add(qh(best));best.subj=subj;best.topic=t.name;qs.push(best);
  }
  return qs;
}

  const lvl=Math.min(LEVELS.length-1,Math.floor(S.stars/PER));const inLvl=S.stars-lvl*PER;
  const date=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  const tiles=ORDER.map(k=>{const s=SUBJ[k],d=td[k];return`<button class="subj ${d?'done':''}" data-daily="${k}" style="--c:${s.c};--cs:${s.cs}"><span class="glyph">${s.glyph}</span><span class="sname">${s.name}<small>${d?'Сделано сегодня':'6 заданий · около 4 минут'}</small></span><span class="state">${d?`✓ ${d.c} из ${d.t}`:'Начать →'}</span></button>`;}).join('');
  const doneAll=dayDone(tk);
  let days='';for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dkey(d);const x=S.days[k]||{};const cnt=ORDER.filter(o=>x[o]).length;days+=`<div class="day ${cnt===3?'full':cnt?'part':''} ${i===0?'today':''}" title="${k}"><i></i><span>${'вспвчпс'[d.getDay()]}</span></div>`;}
  const acc=ORDER.map(k=>{const [c,t]=S.acc[k]||[0,0];return`<div style="--c:${SUBJ[k].c};--cs:${SUBJ[k].cs}"><b>${t?Math.round(c/t*100)+'%':'—'}</b><small>${SUBJ[k].name.split(' ')[0]}</small></div>`;}).join('');
  const tab=SUBJ[S.tab]?S.tab:'en';const ts=SUBJ[tab];
  app.innerHTML=`
  <header class="hero">${sunSVG}<div><h1>Привет, ${esc(S.name)}!</h1><p>${date}</p></div></header>
  <div class="pills"><span class="pill">🔥 <b>${st}</b> ${pl(st,['день','дня','дней'])} подряд</span><span class="pill">⭐ <b>${S.stars}</b> ${pl(S.stars,['звезда','звезды','звёзд'])}</span><span class="pill">🎓 ${LEVELS[lvl]}</span></div>
  <section><div class="sechead"><h2>Задание на сегодня</h2><span class="muted">${ORDER.filter(o=>td[o]).length} из 3</span></div>
   ${doneAll?`<div class="banner"><span class="big">🏆</span><div><h3>День выполнен! +5 звёзд</h3><p>Приходи завтра за новыми заданиями. А пока можно потренироваться ниже.</p></div></div>`:''}
   <div class="subjects">${tiles}</div></section>
  ${S.mistakes.length?`<button class="mist" id="mist"><span class="n">${S.mistakes.length}</span><span>Работа над ошибками<small>Реши ещё раз то, что не получилось</small></span><b>→</b></button>`:''}
  <section style="--c:${ts.c}"><div class="sechead"><h2>Тренировка</h2><span class="muted">8 заданий по теме</span></div>
   <div class="tabs" role="tablist">${ORDER.map(k=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${k===tab}" style="--c:${SUBJ[k].c}">${SUBJ[k].name.split(' ')[0]}</button>`).join('')}</div>
   <div class="chips">${ts.topics.map(t=>`<button class="chip" data-train="${tab}:${t.id}">${t.name}</button>`).join('')}</div></section>
  <section><div class="sechead"><h2>Мои успехи</h2></div>
   <div class="card">
    <div class="lvl"><div class="row"><span>Уровень: <b>${LEVELS[lvl]}</b></span><span class="muted">${lvl<LEVELS.length-1?`${inLvl} / ${PER} ⭐ до «${LEVELS[lvl+1]}»`:'максимум!'}</span></div><div class="meter"><i style="width:${lvl<LEVELS.length-1?inLvl/PER*100:100}%"></i></div></div>
    <div><div class="label" style="margin-bottom:8px">Последние 2 недели</div><div class="days">${days}</div></div>
    <div><div class="label" style="margin-bottom:8px">Правильных ответов</div><div class="acc">${acc}</div></div>
   </div></section>
  <section><div class="sechead"><h2>Настройки</h2></div>
   <div class="card settings">
    <div class="row"><label for="nm">Имя</label><input type="text" id="nm" value="${esc(S.name)}" maxlength="20"><button class="ghost" id="snd">${S.sound?'🔊 Звук включён':'🔇 Звук выключен'}</button></div>
    <div class="row"><button class="ghost ${resetArmed?'warn':''}" id="rst">${resetArmed?'Точно стереть всё? Нажми ещё раз':'Сбросить прогресс'}</button></div>
    <p class="note">Прогресс хранится на этом устройстве, в этом браузере. Каждый день задания новые.</p>
   </div></section>`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

let L=null;
function start(mode,subj,topic){
  let qs;
  if(mode==='daily'){const tk=today();if(!S.lesson||S.lesson.date!==tk)S.lesson={date:tk};if(!S.lesson[subj]){S.lesson[subj]=build(subj,null,6,Math.random);save();}qs=S.lesson[subj].map(q=>Object.assign({},q));}
  else if(mode==='train')qs=build(subj,topic,8,Math.random);
  else qs=shuffle(Math.random,S.mistakes).slice(0,8).map(q=>Object.assign({},q,{options:q.options?(q.fixed?q.options:shuffle(Math.random,q.options)):undefined}));
  L={mode,subj,topic,qs,i:0,correct:0,answered:false,input:''};
  scrollTo(0,0);quiz();
}
function quiz(){
  const q=L.qs[L.i];const s=SUBJ[q.subj];L.answered=false;L.input='';
  const textCls=q.word?'word':(q.long||(q.text&&q.text.length>40))?'long':'';
  const text=q.text?q.text.replace(GAP,'<span class="gap">?</span>'):'';
  let body;
  if(q.kind==='choice'){
    const one=q.one||q.options.some(o=>o.length>14);
    body=`<div class="opts ${one?'one':''}">${q.options.map((o,i)=>`<button class="opt ${q.big?'big':''}" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
  }else if(q.kind==='build'){
    L.picked=[];body=`<div class="bline" id="bl"></div><div class="bpool">${q.words.map((w,i)=>`<button class="bw" data-w="${i}">${esc(w)}</button>`).join('')}</div><button class="next" id="bcheck" disabled>Проверить</button>`;
  }else{
    body=`<div class="numbox" id="nb"><span class="ph">введи ответ</span></div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-k="${n}">${n}</button>`).join('')}<button class="key" data-k="del" aria-label="Стереть">⌫</button><button class="key" data-k="0">0</button><button class="key go" data-k="ok">Проверить</button></div>`;
  }
  app.innerHTML=`<div style="--c:${s.c};--cs:${s.cs};display:flex;flex-direction:column;gap:16px">
   <div class="qtop"><button class="x" id="quit" aria-label="Выйти на главную">✕</button><div class="bar"><i style="width:${L.i/L.qs.length*100}%"></i></div><span class="cnt">${L.i+1}/${L.qs.length}</span></div>
   <div class="qcard pop"><div class="qmeta">${s.name} · ${esc(q.topic)}${L.mode==='mist'?' · ошибка':''}</div><p class="ask">${q.ask}</p>
    ${q.pic?`<div class="pic">${q.pic}</div>`:''}${text?`<div class="qtext ${textCls}">${text}</div>`:''}
    ${q.say?`<button class="say" data-say="${esc(q.say)}">🔊 Послушать</button>`:''}</div>
   <div id="ans">${body}</div><div id="fb"></div></div>`;
  if(q.kind==='build')drawBuild();
  S.seen[qh(q)]=++S.tick;const ks=Object.keys(S.seen);if(ks.length>6000)ks.sort((a,b)=>S.seen[a]-S.seen[b]).slice(0,1500).forEach(k=>delete S.seen[k]);save();
  if(q.say)setTimeout(()=>speak(q.say),250);
}
function drawBuild(){
  const q=L.qs[L.i];document.getElementById('bl').innerHTML=L.picked.length?L.picked.map(i=>`<button class="bw" data-u="${i}">${esc(q.words[i])}</button>`).join(''):'<span class="ph">нажимай на слова по порядку</span>';
  document.querySelectorAll('.bpool .bw').forEach(b=>b.classList.toggle('used',L.picked.includes(+b.dataset.w)));
  document.getElementById('bcheck').disabled=L.picked.length!==q.words.length;
}
function answer(val){
  if(L.answered)return;const q=L.qs[L.i];
  if(q.kind==='num'&&val==='')return;
  L.answered=true;const ok=String(val)===String(q.answer);
  S.acc[q.subj]=S.acc[q.subj]||[0,0];S.acc[q.subj][1]++;
  if(ok){L.correct++;S.stars++;S.acc[q.subj][0]++;}
  const k=qkey(q);
  if(!ok&&L.mode!=='mist'&&!S.mistakes.some(m=>qkey(m)===k)){S.mistakes.push(q);if(S.mistakes.length>40)S.mistakes.shift();}
  if(ok&&L.mode==='mist')S.mistakes=S.mistakes.filter(m=>qkey(m)!==k);
  save();beep(ok);
  if(q.kind==='choice'){document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const o=q.options[b.dataset.i];if(o===q.answer)b.classList.add('ok');else if(o===val)b.classList.add('bad','shake');else b.classList.add('dim');});}
  else if(q.kind==='build'){document.getElementById('bl').classList.add(ok?'ok':'bad');document.querySelectorAll('.bw').forEach(b=>b.disabled=true);document.getElementById('bcheck').remove();}
  else{const nb=document.getElementById('nb');nb.classList.add(ok?'ok':'bad');if(!ok)nb.classList.add('shake');document.querySelectorAll('.key').forEach(b=>b.disabled=true);}
  const g=document.querySelector('.gap');if(g){const f=q.fill!==undefined?q.fill:q.answer;g.textContent=f;g.classList.add('ok');if(f==='')g.style.minWidth='0';}
  const say=q.sayAfter;
  const last=L.i===L.qs.length-1;
  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'} pop"><h3>${ok?pick(Math.random,['Верно! +1 ⭐','Молодец! +1 ⭐','Правильно! +1 ⭐','Так держать! +1 ⭐']):'Не совсем'}</h3>
   ${!ok?`<p>Правильный ответ: <b>${esc(q.kind==='num'?fmt(q.answer):q.answer)}</b></p>`:''}
   ${q.explain?`<p>${q.explain}</p>`:''}
   ${say?`<div class="row"><button class="say" data-say="${esc(say)}">🔊 ${esc(say)}</button></div>`:''}
   <button class="next" id="next">${last?'Готово':'Дальше →'}</button></div>`;
  if(say&&q.subj==='en'&&S.sound)setTimeout(()=>speak(say),350);
  setTimeout(()=>{const n=document.getElementById('next');if(n){n.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'end'});}},60);
}
function next(){if(L.i<L.qs.length-1){L.i++;quiz();scrollTo(0,0);}else finish();}
function finish(){
  const n=L.qs.length,c=L.correct;let bonus=0,dayBonus=false;
  if(c===n&&L.mode!=='mist'){bonus+=2;}
  if(L.mode==='daily'){const tk=today();const before=dayDone(tk);S.days[tk]=S.days[tk]||{};if(!S.days[tk][L.subj])S.days[tk][L.subj]={c,t:n};if(!before&&dayDone(tk)){bonus+=5;dayBonus=true;}}
  S.stars+=bonus;save();
  const s=SUBJ[L.subj]||SUBJ.en;const ratio=c/n;
  const title=L.mode==='mist'?(c===n?'Все ошибки исправлены!':'Часть ошибок исправлена'):ratio===1?'Супер! Ни одной ошибки!':ratio>=.7?'Отлично!':ratio>=.4?'Хорошо! Можно ещё лучше':'Ничего страшного!';
  const sub=L.mode==='mist'?(S.mistakes.length?`Осталось ошибок: ${S.mistakes.length}`:'Список ошибок пуст.'):ratio<.4?'Ошибки попали в «Работу над ошибками». Попробуй их позже ещё раз.':'Каждое верное задание — это звезда.';
  const left=ORDER.filter(o=>!(S.days[today()]||{})[o]);
  app.innerHTML=`<div class="card result pop" style="--c:${s.c};--cs:${s.cs}">
   <div class="starsrow">${L.qs.map((_,i)=>`<span class="${i<c?'':'off'}">⭐</span>`).join('')}</div>
   <div class="score">${c} / ${n}</div><h1>${title}</h1><p class="muted" style="margin:0">${sub}</p>
   ${bonus?`<p style="margin:0;font-weight:700">Бонус: +${bonus} ⭐${dayBonus?' — весь день выполнен!':''}</p>`:''}
   <div class="btns">
    ${L.mode==='daily'&&left.length?`<button class="next" data-daily="${left[0]}">Дальше: ${SUBJ[left[0]].name} →</button>`:''}
    ${L.mode==='train'?`<button class="next" data-train="${L.subj}:${L.topic}">Ещё 8 заданий</button>`:''}
    <button class="btn2" id="home">На главную</button></div></div>`;
  if(ratio>=.7)confetti();
}

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=document.getElementById('fx');const cx=cv.getContext('2d');cv.hidden=false;
  const W=cv.width=innerWidth*devicePixelRatio,H=cv.height=innerHeight*devicePixelRatio;
  const cols=['#FFC23A','#2F8FE8','#1F9E5E','#DE4A7B','#8B6CF0'];
  const ps=Array.from({length:110},()=>({x:W/2,y:H*.35,vx:(Math.random()-.5)*W*.022,vy:-Math.random()*H*.02-H*.004,s:(6+Math.random()*7)*devicePixelRatio,c:cols[Math.random()*5|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  const t0=performance.now();
  (function f(t){cx.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=H*.0006;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore();});
   if(t-t0<2200)requestAnimationFrame(f);else{cx.clearRect(0,0,W,H);cv.hidden=true;}})(t0);
}

/* ---------- events ---------- */
app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.say!==undefined){speak(b.dataset.say);return;}
  if(b.dataset.daily){const k=b.dataset.daily;if((S.days[today()]||{})[k]&&!L){start('train',k,pick(Math.random,SUBJ[k].topics).id);return;}start('daily',k);return;}
  if(b.dataset.train){const [s,t]=b.dataset.train.split(':');start('train',s,t);return;}
  if(b.dataset.tab){S.tab=b.dataset.tab;save();home();return;}
  if(b.dataset.w!==undefined&&L&&!L.answered){const i=+b.dataset.w;if(!L.picked.includes(i)){L.picked.push(i);drawBuild();}return;}
  if(b.dataset.u!==undefined&&L&&!L.answered){L.picked=L.picked.filter(x=>x!==+b.dataset.u);drawBuild();return;}
  if(b.id==='bcheck'&&L){const q=L.qs[L.i];answer(L.picked.map(i=>q.words[i]).join(' '));return;}
  if(b.dataset.i!==undefined&&L){answer(L.qs[L.i].options[b.dataset.i]);return;}
  if(b.dataset.k!==undefined&&L){padKey(b.dataset.k);return;}
  switch(b.id){
    case 'quit':case 'home':home();scrollTo(0,0);break;
    case 'next':next();break;
    case 'mist':start('mist','ru');break;
    case 'snd':S.sound=!S.sound;save();home();break;
    case 'rst':if(resetArmed){const nm=S.name;S=fresh();S.name=nm;save();resetArmed=false;}else resetArmed=true;home();break;
  }
});
app.addEventListener('input',e=>{if(e.target.id==='nm'){S.name=e.target.value.trim()||'Семён';save();const h=document.querySelector('.hero h1');if(h)h.textContent=`Привет, ${S.name}!`;}});
function padKey(k){
  if(!L||L.answered||L.qs[L.i].kind!=='num')return;
  if(k==='ok'){answer(L.input===''?'':String(Number(L.input)));return;}
  if(k==='del')L.input=L.input.slice(0,-1);else if(L.input.length<7)L.input=(L.input+k).replace(/^0+(?=\d)/,'');
  document.getElementById('nb').innerHTML=L.input?fmt(Number(L.input)):'<span class="ph">введи ответ</span>';
}
document.addEventListener('keydown',e=>{
  if(!L||e.target.tagName==='INPUT')return;
  if(L.answered){if(e.key==='Enter'){e.preventDefault();next();}return;}
  const q=L.qs[L.i];
  if(q.kind==='num'){if(/^\d$/.test(e.key))padKey(e.key);else if(e.key==='Backspace')padKey('del');else if(e.key==='Enter'){e.preventDefault();padKey('ok');}}
  else if(q.options&&/^[1-4]$/.test(e.key)&&q.options[e.key-1]!==undefined)answer(q.options[e.key-1]);
});

home();
})();
</script>
